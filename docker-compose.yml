# Усе одним запуском: docker compose up
#
# Піднімає базу, створює таблиці, наповнює їх прикладами і запускає застосунок.
# Далі відкрити http://127.0.0.1:8010

services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_approval
    # Порт наверх — щоб можна було ходити в базу з хоста й гоняти тести
    ports:
      - "5434:5432"
    volumes:
      - expense-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_approval"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    container_name: expense-app
    # Чекаємо, поки база справді готова приймати запити
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://expense:expense@db:5432/expense_approval
      # Якщо ключ є у вашому .env — AI-підказка увімкнеться сама
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8010:8000"

volumes:
  expense-pgdata:
